version: '3.8'

services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      # Docker ichida baza manzili 'localhost' emas, 'db' (konteyner nomi) bo'lishi kerak
      - DATABASE_URL=postgres://postgres:kali@db:5432/tanlov?sslmode=disable
    depends_on:
      - db
    ports:
      - "8085:8080"
    
  userbot:
    build:
      context: .
      dockerfile: Dockerfile.userbot
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./userbot/sessions:/app/userbot/sessions
      - ./userbot/config.json:/app/userbot/config.json
      - ./userbot/sent_users.txt:/app/userbot/sent_users.txt

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kali
      POSTGRES_DB: tanlov
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
